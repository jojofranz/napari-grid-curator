[metadata]
name = napari-grid-curator
version = 0.1.0
author = Johannes Franz
author_email = johannes.franz@maastrichtuniversity.nl
description = Interactive batch annotation tool for microscopy datasets with tiled grid visualization
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Framework :: napari
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Image Processing

[options]
packages = find:
install_requires =
    numpy
    magicgui
    qtpy
    QtAwesome
    napari
    napari-clusters-plotter==0.10.0
    xlsxwriter
    zarr
    aicsimageio[all]
    readlif>=0.6.4
    microfilm
    connected-components-3d
    fastremap
    #=="8.1.0"
    # napari-plugin-engine>=0.1.4
    # numpy>=1.21
    # scikit-learn
    # matplotlib
    # pandas
    # umap-learn
    # napari-tools-menu
    # napari-skimage-regionprops>=0.3.1
    # hdbscan
    # qtpy
    # dask
    # napari>=0.4.19
    # magicgui
    # scikit-image
    # superqt
    # scipy
