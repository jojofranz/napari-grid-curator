name: napari-rgc
display_name: Interactive analysis for retinal ganglion cells
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-rgc.get_reader
      python_name: napari_rgc._reader:napari_get_reader
      title: Open data with Interactive analysis for retinal ganglion cells
    - id: napari-rgc.write_multiple
      python_name: napari_rgc._writer:write_multiple
      title: Save multi-layer data with Interactive analysis for retinal ganglion cells
    - id: napari-rgc.write_single_image
      python_name: napari_rgc._writer:write_single_image
      title: Save image data with Interactive analysis for retinal ganglion cells
    - id: napari-rgc.make_container_widget
      python_name: napari_rgc:ImageThreshold
      title: Make threshold Container widget
    - id: napari-rgc.make_magic_widget
      python_name: napari_rgc:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-rgc.make_function_widget
      python_name: napari_rgc:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-rgc.make_qwidget
      python_name: napari_rgc:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-rgc.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-rgc.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-rgc.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  widgets:
    - command: napari-rgc.make_container_widget
      display_name: Container Threshold
    - command: napari-rgc.make_magic_widget
      display_name: Magic Threshold
    - command: napari-rgc.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-rgc.make_qwidget
      display_name: Example QWidget
